<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%">
  <defs>
    <!-- Brand Gradient: Red/Pink (#FF007F) to Cyan/Blue (#00D2FF) -->
    <linearGradient id="brandGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF007F" />
      <stop offset="100%" stop-color="#00D2FF" />
    </linearGradient>

    <!-- Brand Dark Background (#0F0A1C) -->
    <linearGradient id="bgBrand" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F0A1C" />
      <stop offset="100%" stop-color="#07040E" />
    </linearGradient>
  </defs>

  <!-- Circular Outer Shell -->
  <circle cx="50" cy="50" r="45" fill="url(#bgBrand)" stroke="rgba(255,255,255,0.12)" stroke-width="1.5" />

  <!-- Code Bracket Symbols: Left < -->
  <path d="M 32 38 L 20 50 L 32 62" 
        fill="none" 
        stroke="url(#brandGradient)" 
        stroke-width="6" 
        stroke-linecap="round" 
        stroke-linejoin="round" />

  <!-- Forward Slash / -->
  <path d="M 56 32 L 44 68" 
        fill="none" 
        stroke="url(#brandGradient)" 
        stroke-width="6" 
        stroke-linecap="round" />

  <!-- Right > -->
  <path d="M 68 38 L 80 50 L 68 62" 
        fill="none" 
        stroke="url(#brandGradient)" 
        stroke-width="6" 
        stroke-linecap="round" 
        stroke-linejoin="round" />
</svg>